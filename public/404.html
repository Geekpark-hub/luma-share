<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Your Event</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6fb;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px 36px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 10px;
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      color: #4338ca;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.65;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #4338ca;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover { background: #3730a3; }
    .sub {
      margin-top: 18px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Your Event 2026</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>
      This invite link isn&rsquo;t valid. The URL may be incomplete, or registration may still be processing.
    </p>
    <a class="btn" id="ctaBtn" href="https://luma.com/your-event-id">Get tickets</a>
    <p class="sub">Your City · Aug 3&ndash;4, 2026</p>
  </div>
  <script>
    fetch('/api/public-config')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (data && data.lumaEventUrl) {
          document.getElementById('ctaBtn').href = data.lumaEventUrl;
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
