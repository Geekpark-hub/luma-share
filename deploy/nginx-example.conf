# Nginx 反向代理示例（your-share.example.com）
# 复制到服务器：/etc/nginx/sites-available/your-share.example.com
# 启用：sudo ln -s /etc/nginx/sites-available/your-share.example.com /etc/nginx/sites-enabled/
# 测试：sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d your-share.example.com

# 限流 zone（按客户端 IP；OG 合成 CPU 开销大，单独收紧）
limit_req_zone $binary_remote_addr zone=og_images:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_read:10m rate=60r/m;

server {
    listen 80;
    server_name your-share.example.com;

    # OG 动态图：Nginx 第一道限流（Node 内还有 ogLimiter 第二道）
    location ~ ^/og/.+\.jpg$ {
        limit_req zone=og_images burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 公开读 API（share-message / avatar）
    location ~ ^/api/(share-message|avatar)/ {
        limit_req zone=api_read burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
